services:
  notes-db:
    image: postgres:15-alpine
    container_name: notes-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_password # pragma: allowlist secret
      POSTGRES_DB: notes_db
    volumes:
      - notes_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_user -d notes_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  notes_db_data:
